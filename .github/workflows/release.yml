#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.
#
# Security hardened: actions pinned to SHA, permissions scoped per-job,
# shell injection mitigated via env vars, set -euo pipefail on all bash blocks.

name: Release

# W4: No workflow-level permissions — each job declares only what it needs.
permissions: {}

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: recursive
      # Fail-closed BEFORE anything is built or published (task 1497 follow-up).
      # This used to run only in `set-release-notes`, which is AFTER `host` has
      # already created the GitHub Release and uploaded artifacts to it — a
      # missing/stale RELEASE_NOTES.md still shipped a real release with
      # cargo-dist's auto-generated changelog body. Running it as the first
      # step of `plan`, on tag pushes, stops `dist host --steps=create` below
      # (and every build job downstream) from ever running. No-op on
      # pull_request runs — PRs never publish, so there is nothing to gate.
      - name: Validate release notes (fail-closed, before build/publish)
        if: ${{ !github.event.pull_request }}
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/check-release-notes.sh "${TAG#v}"
      - name: Install dist
        shell: bash
        # W3: replaced curl|sh with `cargo install` from crates.io. The crates.io
        # registry verifies package integrity (checksums in the index, SHA256 of
        # the .crate file) and --locked uses the published Cargo.lock so the
        # toolchain build is reproducible. Binaries land in ~/.cargo/bin which
        # is already on PATH for all GitHub-hosted runners.
        run: |
          set -euo pipefail
          cargo install cargo-dist --version 0.31.0 --locked
      - name: Cache dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        shell: bash
        # C3: Avoid shell injection — github.ref_name flows through TAG env var,
        # not directly interpolated into the run block.
        env:
          IS_PULL_REQUEST: ${{ github.event.pull_request && 'true' || 'false' }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$IS_PULL_REQUEST" = "false" ]; then
            dist host --steps=create "--tag=$TAG" --output-format=json > plan-dist-manifest.json
          else
            dist plan --output-format=json > plan-dist-manifest.json
          fi
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo > /dev/null 2>&1; then
            # W3: curl|sh risk — pinned to rustup.rs official installer with HTTPS-only.
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Remove local [patch] overrides
        # The Cargo.toml [patch] section points to local monorepo paths that
        # don't exist in CI. Strip the section so cargo uses the git dependencies
        # declared in [dependencies] directly.
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, pathlib
          toml = pathlib.Path("Cargo.toml").read_text()
          cleaned = re.sub(r'\n\[patch\.[^\]]+\][^\[]*', '', toml, flags=re.DOTALL)
          pathlib.Path("Cargo.toml").write_text(cleaned)
          print("Removed [patch] section from Cargo.toml for CI build")
          PYEOF
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        env:
          DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
          DIST_ARGS: ${{ matrix.dist_args }}
        shell: bash
        run: |
          set -euo pipefail
          # Actually do builds and make zips and whatnot
          # shellcheck disable=SC2086
          dist build $DIST_TAG_FLAG --print=linkage --output-format=json $DIST_ARGS > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          set -euo pipefail
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        env:
          DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          set -euo pipefail
          dist build $DIST_TAG_FLAG --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        env:
          DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          set -euo pipefail
          dist host $DIST_TAG_FLAG --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        shell: bash
        run: |
          set -euo pipefail
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"

          # C3: RELEASE_TAG comes from an env var, not direct expression interpolation
          # shellcheck disable=SC2086
          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*
      # NOTE: the Scoop-manifest update and the authored-release-notes overwrite
      # both used to live inline here, at the end of `host`. They were split out
      # into their own jobs below (task 1497 / incident: v0.10.0's tag run had
      # this step try to `git push` straight to protected `main` and fail with
      # GH006, which — because they were the LAST steps of this job — marked the
      # whole `host` job failed and caused publish-homebrew-formula/announce to
      # be SKIPPED even though the actual release+artifacts had already
      # published successfully). Splitting them into their own jobs means a
      # failure in either can never again take down the real publish: this job
      # now ends the moment the release + artifacts exist.

  # Rewrites the just-created GitHub Release's body with the authored
  # RELEASE_NOTES.md (cargo-dist's own body is generated from CHANGELOG.md
  # section headers, per the workspace CLAUDE.md rule that every release ships
  # authored notes, not a bare changelog dump — mirrors repos/desktop's
  # release-notes gate). Deliberately its own job, needed only by nothing
  # downstream, so a failure here is loud (the job goes red) but can never
  # skip publish-homebrew-formula or announce, which depend on `host` only.
  set-release-notes:
    needs:
      - plan
      - host
    runs-on: "ubuntu-22.04"
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Validate authored release notes
        # Re-validates the same commit `plan` already gated on before any
        # build/publish happened (see the early step there). Kept here too so
        # this job stays self-contained and still fails loudly (belt and
        # suspenders — cheap to run twice) right before it overwrites the
        # release body.
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-release-notes.sh "${RELEASE_TAG#v}"
      - name: Set release body from RELEASE_NOTES.md
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md

  # Opens a PR against main with scoop/bb.json bumped to the release version +
  # the released Windows artifact's SHA-256, instead of the old behavior of
  # pushing the commit straight to `main` (which GH006-refused on a protected
  # branch — see the note on `host` above). Never blocks publish-homebrew-formula
  # or announce: it's a separate job that only `plan`/`host` feed into, not one
  # they depend on.
  open-scoop-manifest-pr:
    needs:
      - plan
      - host
    runs-on: "ubuntu-22.04"
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Update scoop/bb.json and open a PR
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"

          mkdir -p artifacts
          gh release download "$RELEASE_TAG" \
            --pattern 'beebeeb-cli-x86_64-pc-windows-msvc.zip' \
            --dir artifacts \
            --clobber

          ART="artifacts/beebeeb-cli-x86_64-pc-windows-msvc.zip"
          if [[ ! -f "$ART" ]]; then
            echo "::warning::Windows artifact not found on release $RELEASE_TAG — skipping Scoop manifest update"
            exit 0
          fi

          SHA="$(shasum -a 256 "$ART" | awk '{print $1}')"
          echo "$SHA" > /tmp/win.sha256

          # Use the helper for consistency — same script a human runs locally.
          bash scripts/update-scoop-manifest.sh "$VERSION" /tmp/win.sha256

          if git diff --quiet scoop/bb.json; then
            echo "scoop/bb.json unchanged"
            exit 0
          fi

          BASE_BRANCH="main"
          PR_BRANCH="release/scoop-v${VERSION}"

          git config user.name "axo bot"
          git config user.email "admin+bot@axo.dev"
          # persist-credentials: false (C1 hardening) means we set the remote
          # URL with a token before pushing back, same pattern as
          # publish-homebrew-formula's checkout of the tap repo below.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git checkout -B "$PR_BRANCH"
          git add scoop/bb.json
          git commit -m "release: update scoop manifest to v${VERSION}"
          git push --force origin "HEAD:$PR_BRANCH"

          if gh pr view "$PR_BRANCH" >/dev/null 2>&1; then
            echo "PR for $PR_BRANCH already exists — pushed the update, nothing else to do"
            exit 0
          fi

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$PR_BRANCH" \
            --title "release: update scoop manifest to v${VERSION}" \
            --body "Automated update of \`scoop/bb.json\` to v${VERSION} (SHA-256 \`${SHA}\`) for the [${RELEASE_TAG} release](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}). Opened by the release workflow, run ${GITHUB_RUN_ID}."

  publish-homebrew-formula:
    needs:
      - plan
      - host
    runs-on: "ubuntu-22.04"
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: "axo bot"
      GITHUB_EMAIL: "admin+bot@axo.dev"
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    steps:
      # W7: persist-credentials: false — the HOMEBREW_TAP_TOKEN is used only
      # for checkout authentication, not persisted in the git credential store.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          repository: "beebeeb-io/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # So we have access to the formula
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      # This is extra complex because you can make your Formula name not match your app name
      # so we need to find releases with a *.rb file, and publish with that filename.
      - name: Commit formula files
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"
          # W7: persist-credentials: false means we must set the push URL explicitly.
          git remote set-url origin "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/beebeeb-io/homebrew-tap.git"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name=$(echo "$filename" | sed "s/\.rb$//")
            version=$(echo "$release" | jq .app_version --raw-output)

            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update
            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git push

  announce:
    needs:
      - plan
      - host
      - publish-homebrew-formula
      - smoke-test-2fa
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-homebrew-formula.result == 'skipped' || needs.publish-homebrew-formula.result == 'success') && (needs.smoke-test-2fa.result == 'skipped' || needs.smoke-test-2fa.result == 'success') }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: recursive

  smoke-test-2fa:
    needs:
      - host
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    if: ${{ !github.event.pull_request }}
    env:
      CLI_AUTH_TEST_EMAIL: ${{ secrets.CLI_AUTH_TEST_EMAIL }}
      CLI_AUTH_TEST_PASSWORD: ${{ secrets.CLI_AUTH_TEST_PASSWORD }}
      CLI_AUTH_TEST_TOTP_SECRET: ${{ secrets.CLI_AUTH_TEST_TOTP_SECRET }}
      CLI_AUTH_TEST_RECOVERY_PHRASE: ${{ secrets.CLI_AUTH_TEST_RECOVERY_PHRASE }}
      API_BASE_URL: https://api.beebeeb.io
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Download released bb binary
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p bin
          gh release download "$TAG" \
            --pattern 'beebeeb-cli-x86_64-unknown-linux-musl.tar.xz' \
            --dir bin
          tar -xJf bin/beebeeb-cli-x86_64-unknown-linux-musl.tar.xz -C bin --strip-components=1
          chmod +x bin/bb
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
      - name: Install playwright + otplib in scripts/
        working-directory: scripts
        run: |
          set -euo pipefail
          bun add playwright @otplib/preset-default
          bunx playwright install --with-deps chromium
      - name: Run 2FA smoke test
        if: ${{ env.CLI_AUTH_TEST_EMAIL != '' }}
        run: bash scripts/test-2fa-login.sh
      - name: Skip with loud warning if secrets missing
        if: ${{ env.CLI_AUTH_TEST_EMAIL == '' }}
        run: |
          echo "::warning::2FA smoke test SKIPPED — CLI_AUTH_TEST_EMAIL/PASSWORD/TOTP_SECRET secrets are unset."
          echo "::warning::Set them on beebeeb-io/cli to gate releases on a real end-to-end run."
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: 2fa-smoke-test-evidence
          path: test-2fa-evidence/
