[package]
name = "beebeeb-cli"
description = "bb — Beebeeb CLI for end-to-end encrypted cloud storage"
version = "0.17.4"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/beebeeb-io/cli"
homepage = "https://beebeeb.io"
documentation = "https://beebeeb.io/cli"
keywords = ["encryption", "cloud-storage", "e2ee", "privacy", "cli"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "bb"
path = "src/main.rs"

[dependencies]
beebeeb-core = { git = "https://github.com/beebeeb-io/core", package = "beebeeb-core", rev = "f76ccfc32429d80b6c66ba02c44e9959c9afa93d" }
beebeeb-types = { git = "https://github.com/beebeeb-io/core", package = "beebeeb-types", rev = "f76ccfc32429d80b6c66ba02c44e9959c9afa93d" }
beebeeb-backup = { git = "https://github.com/beebeeb-io/core", package = "beebeeb-backup", rev = "f76ccfc32429d80b6c66ba02c44e9959c9afa93d" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.18"
chrono = { version = "0.4", features = ["serde"] }
colored = "3"
crossterm = "0.28"
# Display width of file names in the transfer lines (task 2333); 0.2.0 is already in Cargo.lock via indicatif and ratatui.
unicode-width = "0.2"
dirs = "6"
regex = "1"
rayon = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rpassword = "7"
hostname = "0.4"
rand = "0.8"
base64 = "0.22"
# Archive writer for `bb pull --zip` (same version/features as beebeeb-core: no new crate in the lockfile).
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# Login handshake crypto (P-256 ECDH + HKDF-SHA256 + AES-256-GCM) now lives in
# beebeeb-core::cli_auth — the CLI no longer pulls p256/aes-gcm/hkdf directly.
# (sha2 is retained below: still used for content hashing in sync.rs / update.rs.)
sha2 = "0.10"
open = "5"
notify = "8"
notify-debouncer-full = "0.7"
walkdir = "2"
axum = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff"] }
mime_guess = "2"
fuser = { version = "0.18", optional = true }
libc = "0.2"
tar = "0.4"
xz2 = "0.1"
semver = "1"
qrcode = { version = "0.14", default-features = false }
percent-encoding = "2"
# `serde`: the stored sign-in (LD-0029) deserializes straight into `Zeroizing<String>`.
zeroize = { version = "1", features = ["serde"] }
# LD-0029: the master key and session token live in the OS keyring, never in plaintext. macOS Keychain, Windows
# Credential Manager, Linux Secret Service over zbus (pure Rust, so the static musl builds link no C library;
# `sync-secret-service` would link libdbus). `tokio` is zbus's runtime; `crypto-rust` encrypts the Secret Service
# session without OpenSSL.
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
ratatui = { version = "0.29", features = ["crossterm"] }

# LD-0029: the owner-only DACL on files that may hold a secret (`src/private_file.rs`). Same version as keyring's.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
# Test-only: an independent AES-256-GCM reference so the share-wrap tests can
# assert the CLI's wrapped_file_key byte-for-byte against the core
# `share_key_wrap` KAT vector (core's public API has no fixed-nonce encrypt).
# Production crypto stays in beebeeb-core.
aes-gcm = "0.10"
# Test-only: `tokio::time::pause`/`advance`, so the hold after a given-up direct upload is tested against a clock
# that only moves when the test moves it (a wall-clock implementation would never see it advance).
tokio = { version = "1", features = ["test-util"] }

[features]
# Enable the FUSE filesystem mount command.
# Requires macFUSE on macOS: brew install macfuse (reboot required).
# Requires libfuse3-dev on Linux: apt install libfuse3-dev.
fuse = ["dep:fuser"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Test builds compile the dependencies optimised, the crate itself not: the `--parallel` goldens and memory test
# seal 2 GiB fixtures, and unoptimised AES does about 9 MB/s (the five goldens took 497 s; at opt-level 2, 29 s).
[profile.test.package."*"]
opt-level = 2

# NOTE: local-dev path override for beebeeb-core/types lives in the gitignored
# .cargo/config.toml (NOT committed). CI builds against the git dependency above.
