[package]
name = "beebeeb-cli"
description = "bb — Beebeeb CLI for end-to-end encrypted cloud storage"
version = "0.6.2"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/beebeeb-io/cli"
homepage = "https://beebeeb.io"
documentation = "https://beebeeb.io/cli"
keywords = ["encryption", "cloud-storage", "e2ee", "privacy", "cli"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "bb"
path = "src/main.rs"

[dependencies]
beebeeb-core = { git = "https://github.com/beebeeb-io/core", package = "beebeeb-core" }
beebeeb-types = { git = "https://github.com/beebeeb-io/core", package = "beebeeb-types" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
colored = "3"
crossterm = "0.28"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
rpassword = "7"
hostname = "0.4"
rand = "0.8"
base64 = "0.22"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
p256 = { version = "0.13", features = ["ecdh"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
open = "5"
notify = "7"
notify-debouncer-full = "0.4"
walkdir = "2"
axum = "0.7"
mime_guess = "2"
fuser = { version = "0.14", optional = true }
libc = "0.2"
tar = "0.4"
xz2 = "0.1"
semver = "1"
qrcode = { version = "0.14", default-features = false }
percent-encoding = "2"
zeroize = "1"

[features]
# Enable the FUSE filesystem mount command.
# Requires macFUSE on macOS: brew install macfuse (reboot required).
# Requires libfuse3-dev on Linux: apt install libfuse3-dev.
fuse = ["dep:fuser"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
